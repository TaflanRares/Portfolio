<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Page not found - 404 Error" />
    <title>404 — Page Not Found</title>

    <link rel="icon" type="image/x-icon" href="/src/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/src/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/favicon/apple-touch-icon.png" />

    <style>
        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/src/Fonts/cormorant-garamond-v21/cormorant-garamond-v21-latin_latin-ext-300.woff2') format('woff2');
            font-weight: 300;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Cormorant Garamond';
            src: url('/src/Fonts/cormorant-garamond-v21/cormorant-garamond-v21-latin_latin-ext-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('/src/Fonts/montserrat-v31/montserrat-v31-latin_latin-ext-200.woff2') format('woff2');
            font-weight: 200;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Montserrat';
            src: url('/src/Fonts/montserrat-v31/montserrat-v31-latin_latin-ext-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg: #ffffff;
            --text: #0f172a;
            --muted: #4e567e;
            --link: #0c653d;
            --footer-bg: #0c653d;
            --footer-text: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0a0e18;
                --text: #e6e9f3;
                --muted: #b3bed8;
                --link: #3d8a64;
                --footer-bg: #0a0e18;
                --footer-text: #e9f5ef;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .error-code {
            font-family: 'Cormorant Garamond', serif;
            font-size: 120px;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 20px;
            color: var(--link);
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 15px;
            color: var(--text);
        }

        p {
            font-size: 16px;
            color: var(--muted);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        a {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--link);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 2px solid var(--link);
        }

        a:hover {
            background-color: transparent;
            color: var(--link);
        }

        a.secondary {
            background-color: transparent;
            color: var(--link);
        }

        a.secondary:hover {
            background-color: var(--link);
            color: white;
        }

        .footer-text {
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 80px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                font-size: 14px;
            }

            a {
                padding: 10px 24px;
                font-size: 13px;
            }

            .button-container {
                gap: 10px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist.</p>
        
        <div class="button-container">
            <a href="/">← Back to Home</a>
            <a href="/#portfolio" class="secondary">View Portfolio →</a>
        </div>

        <p class="footer-text">If you think this is a mistake, feel free to reach out.</p>
    </div>
</body>
</html>
